# Sample Campus Network Topology Configuration
# Used for seeding network nodes, link parameters, and initial graph layout.

network:
  name: "Campus Core & Edge Network"
  description: "5-node campus topology connecting core routers, distribution switch, and application servers."

nodes:
  - id: "router-a"
    name: "router-a"
    ip_address: "192.168.1.1"
    node_type: "router"
    description: "Core Router A - Gateway"

  - id: "router-b"
    name: "router-b"
    ip_address: "192.168.1.2"
    node_type: "router"
    description: "Core Router B - Distribution link"

  - id: "switch-c"
    name: "switch-c"
    ip_address: "192.168.1.3"
    node_type: "switch"
    description: "Access Switch C - Server cluster switch"

  - id: "server-d"
    name: "server-d"
    ip_address: "192.168.1.4"
    node_type: "server"
    description: "Primary Application Server D"

  - id: "server-e"
    name: "server-e"
    ip_address: "192.168.1.5"
    node_type: "server"
    description: "Database & Storage Server E"

links:
  - id: "link-a-b"
    source: "router-a"
    target: "router-b"
    weight: 1
    bandwidth_mbps: 1000
    description: "Core backbone link A <-> B (1 Gbps)"

  - id: "link-b-c"
    source: "router-b"
    target: "switch-c"
    weight: 2
    bandwidth_mbps: 100
    description: "Distribution link B <-> C (100 Mbps)"

  - id: "link-b-d"
    source: "router-b"
    target: "server-d"
    weight: 3
    bandwidth_mbps: 100
    description: "Direct server link B <-> D (100 Mbps)"

  - id: "link-c-d"
    source: "switch-c"
    target: "server-d"
    weight: 2
    bandwidth_mbps: 100
    description: "Switch to server D link (100 Mbps)"

  - id: "link-c-e"
    source: "switch-c"
    target: "server-e"
    weight: 2
    bandwidth_mbps: 100
    description: "Switch to server E link (100 Mbps)"

  - id: "link-a-d"
    source: "router-a"
    target: "server-d"
    weight: 5
    bandwidth_mbps: 100
    description: "Backup route link A <-> D (100 Mbps)"
