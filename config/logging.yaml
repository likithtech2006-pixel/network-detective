# Loguru logging configuration for Network Detective

version: 1
disable_existing_loggers: false

logging:
  level: "INFO"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
  
  handlers:
    console:
      sink: "sys.stdout"
      level: "INFO"
      colorize: true
      backtrace: true
      diagnose: true
      format: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"

    file:
      sink: "logs/network_detective.log"
      level: "DEBUG"
      rotation: "10 MB"
      retention: 5
      compression: "zip"
      encoding: "utf-8"
      backtrace: true
      diagnose: false
      format: "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level: <8} | {name}:{function}:{line} - {message}"

    error_file:
      sink: "logs/network_detective_error.log"
      level: "ERROR"
      rotation: "10 MB"
      retention: 5
      compression: "zip"
      encoding: "utf-8"
      backtrace: true
      diagnose: true
      format: "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level: <8} | {name}:{function}:{line} - {message}"
